name: "⬇️ Fallo de descarga / proveedor"
description: Un episodio no descarga, un servidor falla siempre o un proveedor dejó de mostrar contenido.
title: "[Descarga]: "
labels: ["bug", "download"]
body:
  - type: dropdown
    id: alcance
    attributes:
      label: Alcance del fallo
      description: No es lo mismo un enlace suelto muerto que el proveedor entero caído.
      options:
        - Falla un episodio concreto
        - Fallan todos los episodios de un anime
        - Falla todo el proveedor (búsqueda, catálogo o fichas vacías/rotas)
        - Otro
    validations:
      required: true
  - type: dropdown
    id: proveedor
    attributes:
      label: Proveedor
      options:
        - AnimeAV1
        - JkAnime
    validations:
      required: true
  - type: dropdown
    id: servidor
    attributes:
      label: Servidor
      description: El que muestra la cola para ese episodio, o Auto si no lo tocaste.
      options:
        - "No lo sé (Auto)"
        - HLS
        - Mega
        - Mediafire
        - MP4Upload
    validations:
      required: true
  - type: input
    id: url-anime
    attributes:
      label: URL pública del anime
      description: Solo se aceptan enlaces de animeav1.com o jkanime.net.
      placeholder: "https://animeav1.com/anime/ejemplo o https://jkanime.net/ejemplo"
    validations:
      required: true
  - type: input
    id: episodios
    attributes:
      label: Episodio(s) afectado(s)
      placeholder: "Episodio 12 (o rango, p. ej. 1-5)"
    validations:
      required: true
  - type: textarea
    id: motivo
    attributes:
      label: Motivo mostrado por la app
      description: El texto de Descargas o del Historial (botón Ver más), en texto para poder copiarlo.
      placeholder: "Pegar aquí el mensaje de error tal cual lo muestra la cola."
    validations:
      required: true
  - type: input
    id: versiones
    attributes:
      label: Versiones
      description: App al pie de Ajustes.
      placeholder: "OmniAnime v1.0.4"
    validations:
      required: true
  - type: checkboxes
    id: probado
    attributes:
      label: Qué ya probé (opcional)
      description: Marca lo que aplique. Ayuda a no repetir pasos.
      options:
        - label: Reintenté los fallidos.
        - label: Probé con otro servidor o con el otro proveedor.
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: Fragmento del registro (opcional)
      description: >-
        Últimas líneas relacionadas de app_errors.log
        (Ajustes → Almacenamiento → Abrir registros).
        Recorta a lo relevante.
      placeholder: "Pegar aquí el fragmento, entre triple comilla invertida."
      render: text
    validations:
      required: false
