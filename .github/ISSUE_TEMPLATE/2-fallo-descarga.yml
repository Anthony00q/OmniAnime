name: "⬇️ Fallo de descarga / proveedor"
description: Un episodio no descarga, un servidor falla siempre o un proveedor dejó de mostrar contenido.
title: "[Descarga]: "
labels: ["bug"]
body:
  - type: checkboxes
    id: previas
    attributes:
      label: Antes de reportar
      description: Marca lo que ya intentaste. La mayoría de fallos se resuelven aquí.
      options:
        - label: Actualicé yt-dlp (Ajustes → Descargas → Actualizar yt-dlp) y reintenté los fallidos.
        - label: Probé con otro servidor (botón saltar servidor en Descargas) u otro proveedor.
        - label: No adjunto bases de datos (.db) ni archivos personales, solo URLs públicas y texto del error.
    validations:
      required: true
  - type: dropdown
    id: alcance
    attributes:
      label: Alcance del fallo
      description: Distinguir "un enlace muerto" de "el proveedor cambió" ahorra mucho diagnóstico.
      options:
        - Falla un episodio concreto
        - Fallan todos los episodios de un anime
        - Falla todo el proveedor (búsqueda, catálogo o fichas vacías/rotas)
        - Otro
    validations:
      required: true
  - type: dropdown
    id: proveedor
    attributes:
      label: Proveedor
      options:
        - AnimeAV1
        - JkAnime
    validations:
      required: true
  - type: dropdown
    id: servidor
    attributes:
      label: Servidor
      description: El que muestra la cola para ese episodio, o Auto si no lo tocaste.
      options:
        - "No lo sé (Auto)"
        - HLS
        - PDrain
        - Mega
        - Mediafire
        - MP4Upload
    validations:
      required: true
  - type: input
    id: url-anime
    attributes:
      label: URL pública del anime
      description: Solo se aceptan enlaces de animeav1.com o jkanime.net.
      placeholder: "https://animeav1.com/anime/ejemplo o https://jkanime.net/ejemplo"
    validations:
      required: true
  - type: input
    id: episodios
    attributes:
      label: Episodio(s) afectado(s)
      placeholder: "Episodio 12 (o rango, p. ej. 1-5)"
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Versiones
      description: App al pie de Ajustes y yt-dlp en Ajustes → Descargas.
      placeholder: "OmniAnime v1.0.3 · yt-dlp 2026.01.01 · Windows 11 23H2"
    validations:
      required: true
  - type: textarea
    id: motivo
    attributes:
      label: Motivo mostrado por la app
      description: Copia el texto que aparece en Descargas o en Historial (botón Ver más), no un pantallazo del texto.
      placeholder: "P. ej. el mensaje de error tal cual lo muestra la cola."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Fragmento del registro (opcional, pero decisivo)
      description: >-
        Últimas líneas relacionadas de app_errors.log
        (Ajustes → Almacenamiento → Abrir registros).
        Recorta a lo relevante.
      placeholder: "Pegar aquí el fragmento, entre triple comilla invertida."
      render: text
    validations:
      required: false
