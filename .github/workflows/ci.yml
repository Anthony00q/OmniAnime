name: CI (validación)

run-name: 'CI ${{ github.ref_name }}'

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar npm declarado en package.json
        shell: pwsh
        run: |
          $packageManager = node -p "require('./package.json').packageManager"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm install --global $packageManager

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Comprobar preloads versionados antes de regenerarlos
        run: node scripts/generate-preload.mjs --check

      - name: Formato (Oxfmt)
        run: npm run format:check

      - name: Formato del workflow
        run: npx --no-install vp fmt --check .github/workflows/ci.yml .github/workflows/release.yml

      - name: Compilar renderer (Vite+)
        run: npm run build:vite

      - name: Tipos del renderer con rutas generadas
        run: npm run typecheck:renderer

      - name: Compilar main (tsc)
        run: npm run build:main

      - name: Comprobar preloads compilados
        run: node scripts/generate-preload.mjs --check --dist

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Tipos de las pruebas críticas
        run: npm run typecheck:checks

      - name: Formato de la infraestructura de pruebas
        run: npm run format:checks

      - name: Pruebas críticas sin red externa
        run: npm run test:ci

      - name: Preparar Electron
        run: npx --no-install install-electron

      - name: Piloto de Electron con perfil aislado
        run: npm run test:electron

      - name: Conservar evidencias de las pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: electron-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
