name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-win:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Tag matches package.json version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "El tag $env:GITHUB_REF_NAME no tiene forma vX.X.X"
            exit 1
          }
          $pkg = Get-Content package.json | ConvertFrom-Json
          $expected = "v$($pkg.version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            Write-Error "El tag $env:GITHUB_REF_NAME no coincide con package.json ($expected)"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/extract-release-notes.mjs $version --output release-notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Download tools (yt-dlp/ffmpeg/ffprobe)
        run: node scripts/setup-tools.mjs

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Package installer (no publish)
        run: npm run build:win

      - name: Stage installer artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist-release -Force | Out-Null
          Copy-Item release/OmniAnime-Setup-*.exe, release/OmniAnime-Setup-*.exe.blockmap, release/latest.yml, release-notes.md dist-release/

      - name: List staged artifacts
        shell: pwsh
        run: Get-ChildItem dist-release/ | Format-Table Name, Length

      - name: Verify release artifacts
        shell: pwsh
        run: node scripts/verify-release-artifacts.mjs --dir dist-release --tag "$env:GITHUB_REF_NAME"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: dist-release/
          if-no-files-found: error
          retention-days: 7

  release:
    runs-on: ubuntu-latest
    needs: build-win
    timeout-minutes: 15
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          name: win-installer
          path: ./artifacts

      - name: Create release draft
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            ./artifacts/OmniAnime-Setup-*.exe
            ./artifacts/OmniAnime-Setup-*.exe.blockmap
            ./artifacts/latest.yml
          body_path: ./artifacts/release-notes.md
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
