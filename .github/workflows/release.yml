name: Release (Windows)

run-name: "Release ${{ github.ref_name }}"

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-win:
    name: Compilar instalador (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Instalar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verificar tag coincide con package.json
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "El tag $env:GITHUB_REF_NAME no tiene forma vX.X.X"
            exit 1
          }
          $pkg = Get-Content package.json | ConvertFrom-Json
          $expected = "v$($pkg.version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            Write-Error "El tag $env:GITHUB_REF_NAME no coincide con package.json ($expected)"
            exit 1
          }

      - name: Instalar dependencias (npm ci)
        run: npm ci

      - name: Extraer notas del CHANGELOG
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node scripts/extract-release-notes.mjs $version --output release-notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }

        - name: Descargar herramientas (ffmpeg/ffprobe)
        run: node scripts/setup-tools.mjs

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Compilar app (renderer + main + types)
        run: npm run build

      - name: Empaquetar instalador (sin publicar)
        run: npm run build:win

      - name: Preparar artefactos
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist-release -Force | Out-Null
          Copy-Item release/OmniAnime-Setup-*.exe, release/OmniAnime-Setup-*.exe.blockmap, release/latest.yml, release-notes.md dist-release/

      - name: Listar artefactos
        shell: pwsh
        run: Get-ChildItem dist-release/ | Format-Table Name, Length

      - name: Verificar artefactos
        shell: pwsh
        run: node scripts/verify-release-artifacts.mjs --dir dist-release --tag "$env:GITHUB_REF_NAME"

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: dist-release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publicar borrador
    runs-on: ubuntu-latest
    needs: build-win
    timeout-minutes: 15
    steps:
      - name: Descargar artefactos
        uses: actions/download-artifact@v4
        with:
          name: win-installer
          path: ./artifacts

      - name: Crear borrador de release
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            ./artifacts/OmniAnime-Setup-*.exe
            ./artifacts/OmniAnime-Setup-*.exe.blockmap
            ./artifacts/latest.yml
          body_path: ./artifacts/release-notes.md
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: true
          prerelease: false
