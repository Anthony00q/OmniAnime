<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: transparent;
        color: hsl(0 0% 98%);
        font-family:
          'Inter',
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        -webkit-app-region: drag;
        user-select: none;
        -webkit-font-smoothing: antialiased;
        position: relative;
        padding: 0;
      }

      .splash-card {
        position: relative;
        width: 420px;
        height: 320px;
        background: hsl(240 10% 3.9%);
        border: 1px solid rgba(255, 255, 255, 0.06);
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: drag;
      }

      .splash-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(580px 380px at 50% -10%, hsla(217 91% 60% / 0.13), transparent 68%),
          radial-gradient(460px 300px at 50% 100%, hsla(217 91% 60% / 0.06), transparent 72%);
        pointer-events: none;
        border-radius: 16px;
      }

      .splash {
        position: relative;
        z-index: 1;
        width: 360px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 32px 24px;
        animation: splash-in 220ms cubic-bezier(0.23, 1, 0.32, 1);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
        margin-bottom: 22px;
      }

      .brand-icon {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        position: relative;
        display: grid;
        place-items: center;
        background: transparent;
        overflow: visible;
      }

      .brand-icon::before {
        content: '';
        position: absolute;
        inset: -10px;
        background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.2), transparent 70%);
        filter: blur(14px);
        opacity: 1;
        z-index: -1;
        border-radius: 50%;
      }

      .brand-icon img {
        display: block;
        width: 44px;
        height: 44px;
        object-fit: contain;
        border-radius: 0;
        filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.45));
        opacity: 0;
        transition: opacity 180ms ease;
      }

      #splash-icon-fallback {
        display: none;
        width: 44px;
        height: 44px;
        place-items: center;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 26px;
        font-weight: 900;
        color: #3b82f6;
        background: rgba(59, 130, 246, 0.12);
        border: 1px solid rgba(59, 130, 246, 0.25);
        border-radius: 12px;
      }

      .logo {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 36px;
        font-weight: 900;
        letter-spacing: -2px;
        color: hsl(0 0% 98%);
        line-height: 1;
      }

      .logo span {
        color: #3b82f6;
        font-weight: 900;
      }

      #status-text {
        font-size: 12px;
        color: hsl(214 12% 74%);
        font-weight: 400;
        letter-spacing: 0.02em;
        line-height: 1.4;
        min-height: 17px;
        max-width: 300px;
        margin-bottom: 18px;
        text-wrap: balance;
        opacity: 0.95;
      }

      .progress-wrap {
        width: 244px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .loader-track {
        width: 100%;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 99px;
        overflow: hidden;
        position: relative;
      }

      #progress-fill {
        height: 100%;
        width: 100%;
        background: #3b82f6;
        border-radius: 99px;
        transform: scaleX(0.05);
        transform-origin: left center;
        transition: transform 650ms cubic-bezier(0.32, 0.72, 0, 1);
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 10px rgba(59, 130, 246, 0.38);
      }

      #progress-fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
        transform: translateX(-100%);
        animation: shimmer 1.35s infinite;
      }

      #pct-text {
        font-size: 11px;
        color: hsl(214 10% 62%);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }

      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }

      @keyframes splash-in {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash {
          animation: none;
        }
        #progress-fill {
          transition: transform 160ms ease;
        }
        #progress-fill::after {
          animation: none;
          display: none;
        }
        .brand-icon::before {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="splash-card">
      <div class="splash">
        <div class="brand" aria-hidden="true">
          <div class="brand-icon" aria-hidden="true">
            <img id="splash-icon" alt="" width="44" height="44" decoding="sync" />
            <div id="splash-icon-fallback" aria-hidden="true">O</div>
          </div>
          <div class="logo">Omni<span>Anime</span></div>
        </div>

        <div id="status-text" role="status" aria-live="polite">Iniciando...</div>

        <div class="progress-wrap">
          <div
            class="loader-track"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            aria-label="Progreso de inicio"
          >
            <div id="progress-fill"></div>
          </div>
          <div id="pct-text">0%</div>
        </div>
      </div>
    </div>

    <script>
      const statusEl = document.getElementById('status-text');
      const fillEl = document.getElementById('progress-fill');
      const pctEl = document.getElementById('pct-text');
      const trackEl = document.querySelector('.loader-track');
      const iconEl = document.getElementById('splash-icon');

      const fallbackEl = document.getElementById('splash-icon-fallback');
      const showFallback = () => {
        if (fallbackEl) fallbackEl.style.display = 'grid';
        if (iconEl) iconEl.style.display = 'none';
      };
      if (iconEl) iconEl.addEventListener('error', showFallback);

      let iconResolved = false;
      try {
        const iconPromise = window.splashApi?.getIconDataUrl?.();
        if (!iconPromise) {
          showFallback();
        } else {
          iconPromise.then((url) => {
            iconResolved = true;
            if (url && iconEl) {
              iconEl.src = url;
              iconEl.onload = () => {
                iconEl.style.opacity = '1';
              };
              if (iconEl.complete) iconEl.style.opacity = '1';
            } else {
              showFallback();
            }
          }, showFallback);
          // Red de seguridad: si el IPC no responde, no dejar hueco vacío
          setTimeout(() => {
            if (!iconResolved && (!iconEl || !iconEl.src)) showFallback();
          }, 2500);
        }
      } catch {
        showFallback();
      }

      window.splashApi?.onStatus(({ text, progress }) => {
        if (statusEl) statusEl.textContent = text || '';
        const p = Math.min(100, Math.max(0, progress || 0));
        if (fillEl) fillEl.style.transform = `scaleX(${p / 100})`;
        if (pctEl) pctEl.textContent = `${p}%`;
        if (trackEl) trackEl.setAttribute('aria-valuenow', String(Math.round(p)));
      });
    </script>
  </body>
</html>
